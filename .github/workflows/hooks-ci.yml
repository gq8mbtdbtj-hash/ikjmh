name: hooks-ci

on:
  push:
    paths:
      - "hooks/**"
      - "CMakeLists.txt"
      - ".github/workflows/hooks-ci.yml"
  pull_request:
    paths:
      - "hooks/**"
      - "CMakeLists.txt"
      - ".github/workflows/hooks-ci.yml"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev openssl python3
      - name: Configure
        run: |
          cmake -S . -B build \
            -DTRAY_DEMO_BUILD_HOOKS=ON \
            -DTRAY_DEMO_BUILD_APP=OFF \
            -DTRAY_HOOKS_BUILD_TESTS=ON \
            -DTRAY_HOOKS_BUILD_MEMPROBE=ON
      - name: Build
        run: |
          cmake --build build --target \
            tray_hooks tray_memprobe \
            hooks_unit_tests hooks_apm_tests hooks_apm_https_tests \
            hooks_filter_fuzz_tests hooks_bench_tests \
            hook_whitebox tray_wb_late \
            -j$(nproc)
      - name: Test
        working-directory: build
        run: ctest --test-dir hooks -R "hooks_|hook_whitebox" --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -S . -B build `
            -DTRAY_DEMO_BUILD_HOOKS=ON `
            -DTRAY_DEMO_BUILD_APP=OFF `
            -DTRAY_HOOKS_BUILD_TESTS=ON `
            -DTRAY_HOOKS_BUILD_MEMPROBE=ON
      - name: Build
        run: |
          cmake --build build --config Release --target `
            tray_hooks tray_memprobe `
            hooks_unit_tests hooks_apm_tests hooks_apm_https_tests `
            hooks_filter_fuzz_tests hooks_bench_tests `
            hook_whitebox tray_wb_late
      - name: Test
        working-directory: build
        run: ctest --test-dir hooks -C Release -R "hooks_|hook_whitebox" --output-on-failure

  android-ndk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: false
      - name: Cross-build arm64-v8a + x86_64
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./hooks/scripts/build_android_ndk.sh arm64-v8a x86_64
